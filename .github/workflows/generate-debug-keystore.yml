name: Generate stable debug keystore

on:
  workflow_dispatch: { }

permissions:
  contents: write

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Generate keystore once, if missing
        run: |
          
          if [ -f .github/debug.keystore ]; then
            echo "Stable debug keystore already exists, not overwriting."
            exit 0
          fi
          mkdir -p .github
          keytool -genkeypair -v -keystore .github/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          ls -lh .github/debug.keystore
      - name: Commit keystore to dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/debug.keystore
          git diff --cached --quiet && echo "Nothing to commit, keystore already present." && exit 0
          git commit -m "chore: add stable debug keystore for consistent debug APK signatures"
          git push origin dev
